name: Build and Release MaMo Forge

on:
  workflow_dispatch:
  push:
    branches:
      - replay-Features

jobs:
  build-and-release:
    name: Build JAR and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests -pl forge-gui-desktop -am -T 1C

      - name: Find built JAR
        id: find_jar
        run: |
          JAR=$(find forge-gui-desktop/target -name "forge-gui-desktop-*-jar-with-dependencies.jar" | head -1)
          if [ -z "$JAR" ]; then
            echo "ERROR: JAR not found in forge-gui-desktop/target/" && exit 1
          fi
          echo "jar_path=$JAR" >> $GITHUB_OUTPUT
          echo "jar_name=$(basename $JAR)" >> $GITHUB_OUTPUT
          echo "Found: $JAR ($(du -sh $JAR | cut -f1))"

      - name: Package portable build (JAR + res/)
        id: package
        run: |
          # The fat JAR loads card images/sounds/skins etc. from a `res/` folder next to it at
          # runtime (forge.GuiDesktop.getAssetsDir()) - it does NOT read them from its own
          # classpath even though maven also copies them in there. A bare JAR download crashes
          # immediately after the splash screen with "Cannot find default skin". Ship a
          # self-contained zip so a fresh download actually runs.
          STAGE_DIR="MaMoForge-portable"
          mkdir -p "$STAGE_DIR"
          cp "${{ steps.find_jar.outputs.jar_path }}" "$STAGE_DIR/"
          cp -r forge-gui/res "$STAGE_DIR/res"
          ZIP_NAME="MaMoForge-portable.zip"
          zip -rq "$ZIP_NAME" "$STAGE_DIR"
          echo "zip_path=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "Packaged: $ZIP_NAME ($(du -sh "$ZIP_NAME" | cut -f1))"

      - name: Delete existing replay-features-latest release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete replay-features-latest --yes --repo ${{ github.repository }} 2>/dev/null || true
          git push --delete origin replay-features-latest 2>/dev/null || true

      - name: Create stable tag
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -fa replay-features-latest -m "Latest MaMo Forge build from replay-Features"
          git push origin replay-features-latest --force

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          gh release create replay-features-latest \
            --repo ${{ github.repository }} \
            --title "MaMo Forge (replay-Features) — Latest Build" \
            --notes "Automated build from the \`replay-Features\` branch.

          ## What's included
          - Replay recording and playback support
          - Commander simulation improvements
          - MaMo-specific integration hooks

          **Built from:** \`${{ github.sha }}\`
          **Build date:** ${BUILD_DATE}

          ## Installation
          - **Fresh install:** download \`${{ steps.package.outputs.zip_name }}\`, extract it, and run \`java -jar ${{ steps.find_jar.outputs.jar_name }}\` from inside the extracted folder. This bundles the \`res/\` folder the JAR needs at runtime - a bare JAR alone will crash on launch.
          - **Existing install:** if you already have a \`res/\` folder from a previous extract, you can just drop in the smaller \`${{ steps.find_jar.outputs.jar_name }}\` to update.
          - Configure via the MaMo Connector setup wizard." \
            --prerelease \
            "${{ steps.find_jar.outputs.jar_path }}#${{ steps.find_jar.outputs.jar_name }}" \
            "${{ steps.package.outputs.zip_path }}#${{ steps.package.outputs.zip_name }}"
